<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Catálogo de canciones</title>
</head>
<body>
    <div class="container" id="container">
        <div class="gallery" id="gallery">
            <div class="grid" id="grid"></div>
            <div class="results" id="results"></div>
            <div class="pagination" id="pagination"></div>
        </div>
        <div class="filter" id="filter">
            <div class="form-group">
                <div class="input-group-50" style="display: none;">
                    <label for="titleFilter" class="small-label">Título:</label>
                    <input type="text" id="titleFilter" placeholder="Filtrar por título">
                </div>
                <div class="input-group-50" style="display: none;">
                    <label for="artistFilter" class="small-label">Artista:</label>
                    <input type="text" id="artistFilter" placeholder="Filtrar por artista">
                </div>
                <div class="input-group">
                    <label for="freeTextFilter" class="small-label">Título o artista:</label>
                    <input type="text" id="freeTextFilter" placeholder="Filtrar por título o artista">
                </div>
            </div>
            <div class="form-group">
                <div class="input-group-50">
                    <label for="languageFilter" class="small-label">Idioma:</label>
                    <select id="languageFilter">
                        <option value="">-</option>
                    </select>
                </div>
                <div class="input-group-50">
                    <label for="duetFilter" class="small-label">Tipo:</label>
                    <select id="duetFilter">
                        <option value="">-</option>
                        <option value="false">Solo</option>
                        <option value="true">Dueto</option>
                    </select>
                </div>
            </div>
            <button id="filterButton">Filtrar</button>
        </div>
    </div>

    <script src="songs.js"></script>
    <script src="config.js"></script>
    <script src="languages.js"></script>
    <script src="script.js"></script>
</body>
</html>
